apiVersion: v1
kind: Service
metadata: {name: tika}
spec:
  selector: {app: paperless-tika}
  ports: [{port: 9998}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: paperless-tika}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: paperless-tika}}
  template:
    metadata: {labels: {app: paperless-tika}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: tika
          image: {{ .Values.images.tika | quote }}
          readinessProbe:
            tcpSocket: {port: 9998}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: gotenberg}
spec:
  selector: {app: paperless-gotenberg}
  ports: [{port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: paperless-gotenberg}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: paperless-gotenberg}}
  template:
    metadata: {labels: {app: paperless-gotenberg}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gotenberg
          image: {{ .Values.images.gotenberg | quote }}
          args: [gotenberg, '--chromium-disable-javascript=true', '--chromium-allow-list=file:///tmp/.*']
          readinessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
