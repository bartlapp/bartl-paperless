{{- if eq .Values.renderMode "deployment" }}
{{- if ne .Release.Name "paperless" }}
{{- fail "This package requires release name paperless and one installation per namespace" }}
{{- end }}
{{- $service := include "paperless.service" . | fromYaml }}
{{- $backup := include "paperless.backup" (dict "root" . "service" $service) | fromYaml }}
{{- $oidc := include "paperless.oidc" (dict "root" . "service" $service) | fromYaml }}
apiVersion: paperless.bartl.sh/v1alpha1
kind: PaperlessApplication
metadata:
  name: paperless
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/part-of: bartl-paperless
spec:
  identity:
    installation: {{ .Values.installation | quote }}
    instance: {{ .Values.instance | quote }}
  replicas: {{ $service.replicas }}
  version: {{ $service.version | quote }}
  images:
    {{- toYaml $service.images | nindent 4 }}
  claims:
    {{- toYaml $service.claims | nindent 4 }}
  configurationSecret: {{ $service.configurationSecret | quote }}
  bootstrapSecret: {{ $service.bootstrapSecret | quote }}
  {{- if $backup.enabled }}
  backup:
    {{- omit $backup "enabled" "endpoint" | toYaml | nindent 4 }}
  {{- else }}
  backup: {}
  {{- end }}
  ingress:
    enabled: {{ $service.ingress.enabled }}
    host: {{ $service.hostname | quote }}
    className: {{ $service.ingress.className | quote }}
    tlsSecret: {{ $service.ingress.tlsSecret | quote }}
{{- end }}
