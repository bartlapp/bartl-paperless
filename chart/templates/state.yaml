apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: paperless-database}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: paperless-state}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: paperless-broker}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: paperless-recovery}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: paperless-db}
spec:
  selector: {app: paperless-db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: paperless-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: paperless-db}}
  template:
    metadata: {labels: {app: paperless-db}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          env:
            - {name: POSTGRES_USER, value: bartl}
            - {name: POSTGRES_DB, value: bartl}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: paperless-inputs, key: db-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: [pg_isready, -U, bartl, -d, bartl]}
            periodSeconds: 2
          volumeMounts:
            - {name: database, mountPath: /var/lib/postgresql/data}
            - {name: recovery, mountPath: /recovery}
      volumes:
        - name: database
          persistentVolumeClaim: {claimName: paperless-database}
        - name: recovery
          persistentVolumeClaim: {claimName: paperless-recovery}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: {{ if hasKey .Values "brokerReplicas" }}{{ .Values.brokerReplicas | int }}{{ else }}1{{ end }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ .Values.images.redis | quote }}
          args: [--appendonly, 'yes', --appendfsync, always, --dir, /broker]
          volumeMounts: [{name: broker, mountPath: /broker}]
      volumes:
        - name: broker
          persistentVolumeClaim: {claimName: paperless-broker}
