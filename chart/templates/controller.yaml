apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-controller
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-controller
        app.kubernetes.io/part-of: bartl-paperless
    spec:
      serviceAccountName: paperless-controller
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ required "controller.image is required" .Values.controller.image | quote }}
          imagePullPolicy: {{ .Values.controller.imagePullPolicy }}
          args:
            - --leader-elect=true
            - --metrics-bind-address=0
            - --health-probe-bind-address=:8081
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
