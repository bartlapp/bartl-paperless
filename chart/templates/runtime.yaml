{{- define "paperless.env" }}
- {name: PAPERLESS_DBHOST, value: paperless-db}
- {name: PAPERLESS_DBNAME, value: bartl}
- {name: PAPERLESS_REDIS, value: 'redis://redis:6379'}
- {name: PAPERLESS_URL, value: {{ .Values.identity.paperless | quote }}}
- {name: PAPERLESS_TIME_ZONE, value: {{ .Values.initialization.timezone | quote }}}
- {name: PAPERLESS_OCR_LANGUAGE, value: {{ .Values.initialization.ocr | quote }}}
- {name: PAPERLESS_SCRATCH_DIR, value: /usr/src/paperless/data/scratch}
- {name: PAPERLESS_APPS, value: allauth.socialaccount.providers.openid_connect}
- {name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS, value: 'false'}
- {name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS, value: 'true'}
- {name: PAPERLESS_SOCIAL_AUTO_SIGNUP, value: 'true'}
- {name: PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL, value: {{ .Values.identity.paperless | splitList "://" | first | quote }}}
- {name: PAPERLESS_SOCIAL_ACCOUNT_DEFAULT_GROUPS, value: bartl-users}
- {name: PAPERLESS_DISABLE_REGULAR_LOGIN, value: 'true'}
- {name: PAPERLESS_CSRF_TRUSTED_ORIGINS, value: {{ .Values.identity.paperless | quote }}}
- {name: PAPERLESS_AUDIT_LOG_ENABLED, value: 'true'}
- {name: PAPERLESS_TIKA_ENABLED, value: 'true'}
- {name: PAPERLESS_TIKA_ENDPOINT, value: 'http://tika:9998'}
- {name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT, value: 'http://gotenberg:3000'}
- {name: PAPERLESS_TRAIN_TASK_CRON, value: disable}
- {name: PAPERLESS_EMAIL_TASK_CRON, value: disable}
- {name: PAPERLESS_WORKFLOW_SCHEDULED_TASK_CRON, value: disable}
- {name: PAPERLESS_LLM_INDEX_TASK_CRON, value: disable}
- {name: PAPERLESS_EMPTY_TRASH_TASK_CRON, value: disable}
- {name: PAPERLESS_INDEX_TASK_CRON, value: disable}
- {name: PAPERLESS_SANITY_TASK_CRON, value: disable}
{{- if hasPrefix "https://" .Values.identity.paperless }}
- {name: PAPERLESS_PROXY_SSL_HEADER, value: 'HTTP_X_FORWARDED_PROTO,https'}
{{- end }}
- name: PAPERLESS_SECRET_KEY
  valueFrom: {secretKeyRef: {name: paperless-inputs, key: paperless-key}}
- {name: PAPERLESS_BIND_ADDR, value: 127.0.0.1}
{{- end }}
{{- define "paperless.mounts" }}
- {name: state, mountPath: /state}
- {name: state, mountPath: /usr/src/paperless/data, subPath: data}
- {name: state, mountPath: /usr/src/paperless/media, subPath: media}
- {name: state, mountPath: /usr/src/paperless/consume, subPath: consume}
- {name: broker, mountPath: /broker, readOnly: true}
- {name: recovery, mountPath: /recovery, readOnly: true}
- {name: inputs, mountPath: /inputs, readOnly: true}
- {name: secrets, mountPath: /secrets, readOnly: true}
{{- end }}
apiVersion: v1
kind: Service
metadata: {name: documents}
spec:
  selector: {app: paperless}
  ports: [{port: 18081, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: paperless}
spec:
  replicas: {{ .Values.replicas | int }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app: paperless}}
  template:
    metadata:
      labels: {app: paperless}
      annotations:
        bartl/settings: {{ toJson .Values | sha256sum | quote }}
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      {{- if .Values.placement.identityIP }}
      hostAliases:
        - ip: {{ .Values.placement.identityIP | quote }}
          hostnames: [{{ .Values.identity.issuer | trimPrefix "http://" | trimPrefix "https://" | splitList "/" | first | splitList ":" | first | quote }}]
      {{- end }}
      containers:
        - name: paperless
          image: {{ .Values.images.runtime | quote }}
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/bartl/runtime.py]
          args: [serve]
          env: {{ include "paperless.env" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /accounts/login/, port: 8080}
            periodSeconds: 3
          volumeMounts: {{ include "paperless.mounts" . | nindent 12 }}
      volumes:
        - {name: state, persistentVolumeClaim: {claimName: paperless-state}}
        - {name: broker, persistentVolumeClaim: {claimName: paperless-broker}}
        - {name: recovery, persistentVolumeClaim: {claimName: paperless-recovery}}
        - name: inputs
          configMap:
            name: paperless-contract
            items: [{key: settings, path: settings.json}, {key: allocation, path: allocation.json}]
        - {name: secrets, secret: {secretName: paperless-inputs, defaultMode: 288}}
